<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Do chat ao agente — IESA/UFG</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f6b46">
<meta name="description" content="Curso prático para a comunidade da UFG: como usar agentes de IA com os seus próprios arquivos. Inscrição em menos de um minuto.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Do chat ao agente: IA trabalhando no seu computador">
<meta property="og:description" content="Curso prático para a comunidade da UFG: como usar agentes de IA com os seus próprios arquivos. Inscrição em menos de um minuto.">
<meta property="og:url" content="https://victorgit10.github.io/formularios/curso-chat-ao-agente/">
<meta property="og:image" content="https://victorgit10.github.io/formularios/curso-chat-ao-agente/card-6914eb171f.jpg">
<meta property="og:image:secure_url" content="https://victorgit10.github.io/formularios/curso-chat-ao-agente/card-6914eb171f.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Do chat ao agente: IA trabalhando no seu computador">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--accent:#274c59;--accent-dark:#193b48;--bg:#f2f1ed;--ink:#24353c;--muted:#51616a;--line:#d5dddf;--danger:#8c2f2f;--ok:#245c3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:38px 22px 64px}
header{padding-bottom:26px;border-bottom:2px solid var(--accent);margin-bottom:26px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#536970;margin:0}
h1{font:normal clamp(28px,5vw,38px)/1.15 Georgia,serif;margin:10px 0 12px;letter-spacing:-.4px}
h2{font-size:20px;margin:0 0 10px}
header p{color:var(--muted);margin:8px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;margin:0 0 18px}
.field{margin:0 0 22px}
.field:last-child{margin-bottom:0}
label,.legend{display:block;font-weight:600;margin:0 0 6px}
.help{font-size:14px;color:#596c74;margin:4px 0 0}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{width:100%;border:1px solid #b9c8ce;border-radius:4px;padding:11px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid #b9c8ce;border-radius:4px;background:#fff;color:var(--accent);padding:11px 16px;min-height:46px}
button:hover{background:#edf3f5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a2bfca;outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button:disabled{opacity:.55;cursor:wait}
fieldset{border:0;padding:0;margin:0}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt:hover{background:#f7fafb}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.msg{margin:0 0 18px;padding:12px 14px;border-radius:4px;font-size:15px}
.msg.error{background:#fbecec;border:1px solid #e8c4c4;color:var(--danger)}
.msg.ok{background:#eaf5ee;border:1px solid #c4e2cf;color:var(--ok)}
.msg:empty{display:none}
.req{color:var(--danger);margin-left:2px}
.counter{font-size:12px;color:#6e8188;text-align:right;margin-top:4px}
.muted{font-size:14px;color:var(--muted)}
footer{margin-top:26px;font-size:13px;color:#6e8188;text-align:center}
a{color:var(--accent)}
</style>
</head>
<body><main>
<header><p class="eyebrow" id="eyebrow">Inscrições</p><h1 id="titulo">Do chat ao agente — IESA/UFG</h1><p id="descricao"></p><p id="intro" hidden></p></header>
<div id="aviso" class="msg" role="status" aria-live="polite"></div>
<form id="form" novalidate>
  <div class="card" id="campos"></div>
  <div class="hp" aria-hidden="true"><label>Não preencha este campo<input id="website" tabindex="-1" autocomplete="off"></label></div>
  <button class="primary" type="submit" id="enviar" style="width:100%">Enviar inscrição</button>
  <p class="muted" id="consentNote"></p>
</form>
<section class="card" id="sucesso" hidden>
  <h2>Inscrição registrada</h2>
  <p id="sucessoTexto"></p>
  <p class="muted">Guarde o protocolo. Se precisar corrigir algo, responda o e-mail de confirmação.</p>
</section>
<section class="card" id="encerrado" hidden><h2>Inscrições encerradas</h2><p id="encerradoTexto"></p></section>
<section class="card" id="adminMudou" hidden>
  <h2>O painel mudou de endereço</h2>
  <p>O painel administrativo agora fica em outro lugar.</p>
  <p><a href="../admin/">Abrir o painel</a></p>
</section>
<footer id="rodape"></footer>
<noscript><p class="card">Ative o JavaScript do navegador para preencher este formulário.</p></noscript>
</main>
<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbx7v3hYGUX8PIW0kuZPWKkJyK2CokoLrhmsteclK4qihPwDMW9jOaaRHxd7ltYkXgYpHw/exec";
const SLUG = "curso-chat-ao-agente";
let SCHEMA = {"slug":"curso-chat-ao-agente","title":"Do chat ao agente: IA trabalhando no seu computador — IESA/UFG","eyebrow":"IESA/UFG · Inscrição no curso","description":"Preencha os campos abaixo para se inscrever. Leva menos de um minuto.","intro":"","footer":"IESA/UFG · Curso Do chat ao agente","consentNote":"Seus dados serão usados apenas para organizar este curso. Não serão compartilhados com terceiros e podem ser excluídos a pedido pelo e-mail de contato.","openAt":"","closeAt":"","versao":"8b74117d78f79e9c7f9630df41bb135b3f1811884b3f2e049a836f87bc46b950","fields":[{"id":"nome","type":"text","label":"Nome completo","help":"","required":true,"options":[],"minLength":3,"maxLength":100,"placeholder":"Como você se chama","autocomplete":"name"},{"id":"vinculo","type":"radio","label":"Vínculo com a UFG","help":"","required":true,"options":["Discente","Docente","TAE"],"minLength":0,"maxLength":0,"placeholder":"","autocomplete":""},{"id":"email","type":"email","label":"E-mail de contato","help":"Usaremos este endereço para enviar o aviso de inscrição recebida e as informações do curso.","required":true,"options":[],"minLength":0,"maxLength":160,"placeholder":"","autocomplete":"email"},{"id":"equipamento","type":"radio","label":"Para realizar o curso na sala de aula, você tem notebook próprio ou precisa de um PC?","help":"","required":true,"options":["Tenho notebook próprio","Preciso de PC na sala de aula"],"minLength":0,"maxLength":0,"placeholder":"","autocomplete":""}]};
const THEME = {"accent":"#1f6b46","accentDark":"#145233"};
const $ = id => document.getElementById(id);
let requestId = null, enviado = false;

if (THEME && THEME.accent) {
  document.documentElement.style.setProperty('--accent', THEME.accent);
  document.documentElement.style.setProperty('--accent-dark', THEME.accentDark || THEME.accent);
}

function mensagem(texto, erro) {
  $('aviso').textContent = texto || '';
  $('aviso').className = 'msg ' + (erro ? 'error' : 'ok');
}
async function api(action, ...args) {
  let response, data;
  try {
    response = await fetch(BACKEND, {
      method: 'POST', mode: 'cors', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ action, slug: SLUG, args }),
      cache: 'no-store', redirect: 'follow', signal: AbortSignal.timeout(45000),
    });
    data = await response.json();
  } catch {
    const err = new Error('Não foi possível receber a resposta do servidor. Confira sua conexão e tente novamente.');
    err.connection = true;
    throw err;
  }
  if (!response.ok || !data.ok) throw new Error(data.error || 'Não foi possível concluir. Tente novamente.');
  return data.data;
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  return [...b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// ── status local e tela ────────────────────────────────────────────────
function statusLocal() {
  const agora = Date.now();
  const abre = SCHEMA.openAt ? Date.parse(SCHEMA.openAt) : 0;
  const fecha = SCHEMA.closeAt ? Date.parse(SCHEMA.closeAt) : 0;
  if (abre && agora < abre) return { open: false, message: 'As inscrições ainda não abriram.' };
  if (fecha && agora > fecha) return { open: false, message: 'As inscrições encerraram.' };
  return { open: true, message: '' };
}
function aplicarTela(st) {
  if (enviado) return;
  if (st && st.open === false) {
    $('form').hidden = true;
    $('sucesso').hidden = true;
    $('encerrado').hidden = false;
    $('encerradoTexto').textContent = st.message || 'As inscrições estão encerradas.';
  } else {
    $('encerrado').hidden = true;
    $('form').hidden = false;
  }
}

// ── campos ─────────────────────────────────────────────────────────────
function criarCampo(f) {
  const bloco = document.createElement('div');
  bloco.className = 'field';
  const ajuda = () => {
    if (!f.help) return null;
    const p = document.createElement('p');
    p.className = 'help'; p.textContent = f.help;
    return p;
  };
  if (f.type === 'radio' || f.type === 'checkbox') {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.className = 'legend'; lg.textContent = f.label;
    if (f.required) { const s = document.createElement('span'); s.className = 'req'; s.textContent = '*'; lg.append(s); }
    fs.append(lg);
    const opts = document.createElement('div'); opts.className = 'opts';
    f.options.forEach(o => {
      const lab = document.createElement('label'); lab.className = 'opt';
      const inp = document.createElement('input');
      inp.type = f.type === 'checkbox' ? 'checkbox' : 'radio';
      inp.name = 'f_' + f.id; inp.value = o;
      lab.append(inp, document.createTextNode(' ' + o));
      opts.append(lab);
    });
    fs.append(opts);
    bloco.append(fs);
    const a = ajuda(); if (a) bloco.append(a);
    return bloco;
  }
  if (f.type === 'consent') {
    const lab = document.createElement('label'); lab.className = 'opt';
    const inp = document.createElement('input');
    inp.type = 'checkbox'; inp.id = 'f_' + f.id; inp.value = 'Sim';
    lab.append(inp, document.createTextNode(' ' + f.label));
    bloco.append(lab);
    const a = ajuda(); if (a) bloco.append(a);
    return bloco;
  }
  const lab = document.createElement('label'); lab.htmlFor = 'f_' + f.id; lab.textContent = f.label;
  if (f.required) { const s = document.createElement('span'); s.className = 'req'; s.textContent = '*'; lab.append(s); }
  bloco.append(lab);
  let el;
  if (f.type === 'textarea') {
    el = document.createElement('textarea'); el.rows = 5;
    if (f.placeholder) el.placeholder = f.placeholder;
    if (f.maxLength) el.maxLength = f.maxLength;
  } else if (f.type === 'select') {
    el = document.createElement('select');
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = 'Selecione…'; ph.disabled = true; ph.selected = true;
    el.append(ph);
    f.options.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; el.append(op); });
  } else {
    el = document.createElement('input');
    el.type = f.type === 'tel' ? 'tel' : (f.type === 'url' ? 'url' : (f.type === 'email' ? 'email' : 'text'));
    if (f.placeholder) el.placeholder = f.placeholder;
    if (f.maxLength) el.maxLength = f.maxLength;
    if (f.autocomplete) el.autocomplete = f.autocomplete;
  }
  el.id = 'f_' + f.id;
  if (f.type !== 'select' && f.minLength) el.minLength = f.minLength;
  el.required = !!f.required;
  bloco.append(el);
  const a = ajuda(); if (a) bloco.append(a);
  if (f.type === 'textarea' && f.maxLength) {
    const c = document.createElement('div'); c.className = 'counter';
    const atualizar = () => { c.textContent = el.value.length + ' / ' + f.maxLength; };
    el.addEventListener('input', atualizar); atualizar();
    bloco.append(c);
  }
  return bloco;
}
function renderTudo() {
  document.title = SCHEMA.title;
  $('eyebrow').textContent = SCHEMA.eyebrow || 'Inscrições';
  $('titulo').textContent = SCHEMA.title;
  $('descricao').textContent = SCHEMA.description || '';
  $('intro').textContent = SCHEMA.intro || '';
  $('intro').hidden = !SCHEMA.intro;
  $('rodape').textContent = SCHEMA.footer || '';
  $('consentNote').textContent = SCHEMA.consentNote || '';
  $('campos').replaceChildren(...SCHEMA.fields.map(criarCampo));
}

function valorDe(f) {
  if (f.type === 'checkbox') return [...document.querySelectorAll('input[name="f_' + f.id + '"]:checked')].map(i => i.value);
  if (f.type === 'radio') {
    const c = document.querySelector('input[name="f_' + f.id + '"]:checked');
    return c ? c.value : '';
  }
  if (f.type === 'consent') {
    const el = $('f_' + f.id);
    return el && el.checked ? 'Sim' : '';
  }
  const el = $('f_' + f.id);
  return el ? el.value : '';
}
function validarCliente() {
  const erros = [];
  for (const f of SCHEMA.fields) {
    const v = valorDe(f);
    if (f.type === 'checkbox') {
      if (f.required && !v.length) erros.push('Marque ao menos uma opção em "' + f.label + '".');
      continue;
    }
    if (f.type === 'consent') {
      if (f.required && v !== 'Sim') erros.push('É necessário aceitar "' + f.label + '".');
      continue;
    }
    const t = String(v).trim();
    if (f.required && !t) erros.push('Preencha "' + f.label + '".');
    if (t && f.minLength && t.length < f.minLength) erros.push('"' + f.label + '" precisa de pelo menos ' + f.minLength + ' caracteres.');
    if (t && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)) erros.push('Informe um e-mail válido em "' + f.label + '".');
    if (t && f.type === 'tel' && !/^[+()\d\s-]{8,20}$/.test(t)) erros.push('Informe um telefone válido em "' + f.label + '".');
    if (t && f.type === 'url' && !/^https?:\/\/\S+$/i.test(t)) erros.push('O endereço em "' + f.label + '" precisa começar com http:// ou https://.');
  }
  if (erros.length) throw new Error(erros[0]);
}

// ── envio ──────────────────────────────────────────────────────────────
$('form').onsubmit = async e => {
  e.preventDefault();
  try { validarCliente(); } catch (err) { mensagem(err.message, true); return; }
  requestId = requestId || uuid();
  $('enviar').disabled = true;
  try {
    const values = {};
    for (const f of SCHEMA.fields) values[f.id] = valorDe(f);
    const r = await api('submit', { requestId, ...values, website: $('website').value });
    requestId = null;
    enviado = true;
    $('form').hidden = true;
    $('sucesso').hidden = false;
    $('sucessoTexto').textContent = 'Protocolo ' + r.protocol + (r.name ? ' — ' + r.name : '') + '.';
    mensagem('Inscrição registrada com sucesso.', false);
    $('sucesso').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    mensagem(err.connection
      ? 'A conexão foi interrompida. Clique novamente em Enviar para consultar o resultado — não será registrado em duplicidade.'
      : err.message, true);
    if (!err.connection) requestId = null;
  } finally {
    $('enviar').disabled = false;
  }
};

// ── servidor: status e definição atualizada ────────────────────────────
async function sincronizar() {
  let st;
  try { st = await api('getStatus'); } catch { return; }
  if (!st) return;
  if (st.versao && st.versao !== SCHEMA.versao) {
    try {
      const novo = await api('getForm');
      if (novo && Array.isArray(novo.fields)) {
        SCHEMA = novo;
        renderTudo();
        aplicarTela(novo.status || st);
        return;
      }
    } catch { /* mantém a definição embutida */ }
  }
  aplicarTela(st);
}

// ── inicialização ──────────────────────────────────────────────────────
if (location.hash.indexOf('admin=') >= 0) {
  document.querySelector('header').hidden = true;
  $('form').hidden = true;
  $('sucesso').hidden = true;
  $('encerrado').hidden = true;
  $('adminMudou').hidden = false;
} else {
  renderTudo();
  aplicarTela(statusLocal());
  sincronizar();
}
</script>
</body>
</html>
